<title>Download</title><style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial;
}

/* tombol */
#start {
  position: absolute;
  top: 40%;
  width: 100%;
  text-align: center;
  color: white;
}

button {
  padding: 15px 30px;
  font-size: 20px;
  background: green;
  color: white;
  border: none;
  border-radius: 10px;
}

/* main */
#main {
  display: none;
  width: 100%;
  height: 100%;
}

/* background glitch */
#bg {
  position: absolute;
  width: 100%;
  height: 100%;
}

/* gambar glitch */
#img {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 70vw;
  max-width: 400px;
}

/* flash */
#flash {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80vw;
  max-width: 400px;
  z-index: 999;
}

/* ===== MATA ===== */
#eye {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 120px;
  height: 60px;
  background: white;
  border-radius: 50%;
  overflow: hidden;
  z-index: 10;
}

#pupil {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 25px;
  height: 25px;
  background: black;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

#eyelid {
  position: absolute;
  width: 100%;
  height: 0%;
  background: black;
  top: 0;
}

@keyframes blinkEye {
  0% { height: 0%; }
  50% { height: 100%; }
  100% { height: 0%; }
}

  setInterval(() => {

// flash + suara
